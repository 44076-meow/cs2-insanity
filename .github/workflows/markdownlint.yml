name: markdownlint

on:
  push:
    # `skins` is the active integration branch for ReplicaPaints work
    # — paints docs land there first. See issue #56.
    branches: [main, skins]
    paths:
      - "**/*.md"
      - ".github/workflows/markdownlint.yml"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/markdownlint.yml"
      - ".markdownlint.json"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !ReplicaHider/hl2sdk/**
            !ReplicaHider/mmsource/**
