# GitHub Actions CI for replica.
#
# Triggers on every push to main + every PR + every v*-tag. Goal: catch
# compile-fails on both halves of the stack before they hit the live server.
# Does NOT actually deploy — that's still manual via scripts/deploy.sh.
#
# Two parallel build jobs:
#   build-cssharp  — Replica (C# / .NET 8 / CSSharp). Builds twice
#                    and compares sha256 to enforce reproducibility (the
#                    "DLL drift" failure mode that bit v0.6.0.7→0.8 and
#                    v0.6.0.10→0.11 — see scripts/deploy.sh comments).
#   build-hider    — ReplicaHider (C++ / Metamod:Source / CS2 SDK).
#
# A `package` job runs on tag pushes only. It assembles a server-relative
# tarball, attaches it to a GitHub Release, and marks pre-release on tags
# that contain a hyphen (e.g. v0.7.2-beta).
#
# Caches:
#   - NuGet packages (~/.nuget/packages) keyed on csproj hash.
#   - hl2sdk + metamod-source clones, keyed on branch + workflow hash so
#     touching the workflow invalidates them.

name: build

on:
  push:
    # `skins` is the active integration branch for ReplicaPaints work
    # (~22k LOC of C# + catalogs); without it on the trigger list the
    # branch was racking up source-touching commits with zero CI coverage.
    # See issue #56.
    branches: [main, skins]
    tags: ['v*']
  pull_request:
    branches: [main, skins]
  workflow_dispatch:
    inputs:
      tag:
        description: |
          Optional. Existing v* tag to build + publish a Release for
          (backfill mode — see issue #36). When non-empty:
            * All build jobs check out the tagged commit, not main.
            * The package job runs and publishes a GitHub Release for
              that tag, even though github.ref is refs/heads/main
              (the normal tag-push trigger is bypassed because the
              workflow file at the old tag predated the auto-release).
          Leave blank for a regular dry-run of main.
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  CSSHARP_VERSION: "1.0.367"
  HL2SDK_REPO: "https://github.com/alliedmodders/hl2sdk.git"
  HL2SDK_BRANCH: "cs2"
  MMSOURCE_REPO: "https://github.com/alliedmodders/metamod-source.git"
  MMSOURCE_BRANCH: "master"

jobs:
  build-cssharp:
    name: Replica (.NET / CSSharp)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          # Backfill mode: check out the supplied tag instead of main
          # (see issue #36). Empty string falls through to the default
          # ref of the dispatching event.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Fetch CounterStrikeSharp.API.dll (v${{ env.CSSHARP_VERSION }})
        run: |
          mkdir -p .ci/cssharp-api
          url="https://github.com/roflmuffin/CounterStrikeSharp/releases/download/v${CSSHARP_VERSION}/counterstrikesharp-linux-${CSSHARP_VERSION}.zip"
          curl -fsSL --retry 4 --retry-delay 4 -o /tmp/cssharp.zip "$url"
          unzip -o -q /tmp/cssharp.zip -d /tmp/cssharp/
          api_dll=$(find /tmp/cssharp -name 'CounterStrikeSharp.API.dll' | head -1)
          [ -n "$api_dll" ] || { echo "API dll not found in zip" >&2; exit 1; }
          cp "$api_dll" .ci/cssharp-api/CounterStrikeSharp.API.dll

      - name: dotnet restore
        run: dotnet restore Replica/Replica.csproj

      - name: dotnet build (Release, warnings-as-errors) — pass 1
        run: |
          dotnet build Replica/Replica.csproj \
            -c Release \
            --no-restore \
            -warnaserror \
            --nologo \
            -p:CSSharpApiPath="${{ github.workspace }}/.ci/cssharp-api/CounterStrikeSharp.API.dll"

      - name: Capture pass-1 sha256 + stash DLL
        run: |
          dll=Replica/bin/Release/net8.0/Replica.dll
          [ -f "$dll" ] || { echo "DLL missing post-build" >&2; exit 1; }
          sha1=$(sha256sum "$dll" | awk '{print $1}')
          echo "Pass-1 DLL sha256: $sha1"
          echo "DLL_SHA256=$sha1" >> "$GITHUB_ENV"
          mkdir -p .ci/pass1
          cp "$dll" .ci/pass1/Replica.dll

      - name: Determinism guard — clean rebuild + compare
        run: |
          # Wipe build outputs so MSBuild can't reuse cached intermediates.
          rm -rf Replica/bin Replica/obj
          dotnet build Replica/Replica.csproj \
            -c Release \
            -warnaserror \
            --nologo \
            -p:CSSharpApiPath="${{ github.workspace }}/.ci/cssharp-api/CounterStrikeSharp.API.dll"
          dll=Replica/bin/Release/net8.0/Replica.dll
          sha2=$(sha256sum "$dll" | awk '{print $1}')
          echo "Pass-2 DLL sha256: $sha2"
          if [ "$sha2" != "$DLL_SHA256" ]; then
            echo "::error::DLL hash drifted between clean rebuilds: $DLL_SHA256 -> $sha2" >&2
            echo "Determinism is broken — investigate before deploying." >&2
            exit 1
          fi
          echo "✓ deterministic ($sha2)"

      - name: Upload Replica artifact
        uses: actions/upload-artifact@v7
        with:
          name: Replica-${{ github.sha }}
          path: |
            Replica/bin/Release/net8.0/Replica.dll
            Replica/bin/Release/net8.0/Replica.pdb
            Replica/cfg/**
            Replica/gamedata/**
          retention-days: 14

  build-hider:
    name: ReplicaHider (C++ / Metamod / CS2 SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential make

      - name: Cache hl2sdk clone
        id: cache-hl2sdk
        uses: actions/cache@v6
        with:
          path: ReplicaHider/hl2sdk
          key: hl2sdk-${{ env.HL2SDK_BRANCH }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Cache metamod-source clone
        id: cache-mmsource
        uses: actions/cache@v6
        with:
          path: ReplicaHider/mmsource
          key: mmsource-${{ env.MMSOURCE_BRANCH }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Vendor hl2sdk (${{ env.HL2SDK_BRANCH }} branch)
        if: steps.cache-hl2sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$HL2SDK_BRANCH" \
            "$HL2SDK_REPO" ReplicaHider/hl2sdk

      - name: Vendor metamod-source (${{ env.MMSOURCE_BRANCH }} branch)
        if: steps.cache-mmsource.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MMSOURCE_BRANCH" \
            "$MMSOURCE_REPO" ReplicaHider/mmsource

      - name: Ensure protoc is executable
        run: chmod +x ReplicaHider/hl2sdk/devtools/bin/linux/protoc || true

      - name: Apply SDK compat patches
        run: scripts/ci-patch-sdks.sh ReplicaHider/hl2sdk

      - name: make
        working-directory: ReplicaHider
        run: |
          make -j"$(nproc)"

      - name: Compute and surface .so sha256
        run: |
          so=ReplicaHider/build/replicahider.so
          [ -f "$so" ] || { echo ".so missing post-build" >&2; exit 1; }
          sha=$(sha256sum "$so" | awk '{print $1}')
          echo "SO sha256: $sha"
          echo "SO_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Upload ReplicaHider artifact
        uses: actions/upload-artifact@v7
        with:
          name: ReplicaHider-${{ github.sha }}
          path: |
            ReplicaHider/build/replicahider.so
            ReplicaHider/replicahider.vdf
          retention-days: 14

  package:
    name: package + release
    runs-on: ubuntu-latest
    needs: [build-cssharp, build-hider]
    # Runs on:
    #   * tag pushes (the normal trigger)
    #   * workflow_dispatch with a non-empty `tag` input (backfill — #36)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    timeout-minutes: 5
    permissions:
      contents: write   # required by softprops/action-gh-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download Replica artifact
        uses: actions/download-artifact@v8
        with:
          name: Replica-${{ github.sha }}
          path: out/cssharp

      - name: Download ReplicaHider artifact
        uses: actions/download-artifact@v8
        with:
          name: ReplicaHider-${{ github.sha }}
          path: out/hider

      - name: Stage server-relative tree
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          # Tag-push: github.ref is refs/tags/<tag>; backfill: read input.
          tag="${INPUT_TAG:-${GITHUB_REF##*/}}"
          root=stage/replica-${tag}

          # upload-artifact@v4 strips the LCD path prefix from uploads, so:
          #   out/cssharp/bin/Release/net8.0/Replica.dll
          #   out/cssharp/cfg/, out/cssharp/gamedata/
          #   out/hider/build/replicahider.so
          #   out/hider/replicahider.vdf

          # CSSharp side: csgo/addons/counterstrikesharp/plugins/Replica/
          plug_dir=$root/csgo/addons/counterstrikesharp/plugins/Replica
          mkdir -p "$plug_dir"
          cp out/cssharp/bin/Release/net8.0/Replica.dll "$plug_dir/"
          cp out/cssharp/bin/Release/net8.0/Replica.pdb "$plug_dir/" || true
          cp -r out/cssharp/cfg "$plug_dir/"
          cp -r out/cssharp/gamedata "$plug_dir/"

          # Metamod side: csgo/addons/metamod/{bin/linuxsteamrt64,*.vdf}
          mm_bin=$root/csgo/addons/metamod/bin/linuxsteamrt64
          mm_dir=$root/csgo/addons/metamod
          mkdir -p "$mm_bin" "$mm_dir"
          cp out/hider/build/replicahider.so "$mm_bin/"
          cp out/hider/replicahider.vdf "$mm_dir/"

      - name: Tarball + sha256
        id: bundle
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF##*/}}"
          tar -czf "replica-${tag}.tar.gz" -C stage "replica-${tag}"
          sha256sum "replica-${tag}.tar.gz" | tee "replica-${tag}.tar.gz.sha256"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: replica-${{ steps.bundle.outputs.tag }}
          path: |
            replica-*.tar.gz
            replica-*.tar.gz.sha256
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # All current tags are -beta / -alpha. A hyphenated tag is
          # treated as pre-release; clean tags like v1.0.0 publish as
          # full releases.
          # In backfill mode (workflow_dispatch + tag input) `github.ref`
          # is refs/heads/main, so explicitly pin tag_name from the
          # bundle step's resolved value.
          tag_name: ${{ steps.bundle.outputs.tag }}
          prerelease: ${{ contains(steps.bundle.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            replica-*.tar.gz
            replica-*.tar.gz.sha256
